name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # python: the Hermes plugin (integrations/hermes-lean-ctx) ships to
        # users, and the security/delivery gates are Python. It was scanned
        # only by the retired default setup, whose last run was April 2026.
        language: [javascript-typescript, actions, python]
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          category: "/language:${{ matrix.language }}"

  analyze-rust:
    name: Analyze (rust)
    # Trusted runs use the self-hosted pounce runners (see ci.yml); forks and
    # Dependabot stay on GitHub-hosted runners.
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && vars.SELF_HOSTED_CI != 'off' && fromJSON('["self-hosted","pounce"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false

      # CodeQL extracts Rust from source (build-mode none); the former
      # `cargo build --release` here took 14 of the job's 33 minutes and fed
      # the analysis nothing.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          languages: rust
          build-mode: none
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          category: "/language:rust"
