[graph]
targets = []
all-features = true

[advisories]
# cargo-deny >= 0.19 removed `vulnerability` and `notice` config knobs:
# all vulnerability/notice advisories now emit errors unless explicitly ignored.
# `unmaintained`/`unsound` now control which dependencies can fail the check.
# cargo-deny treats `all` as the strict equivalent of a deny policy.
unmaintained = "all"
yanked = "deny"
unused-ignored-advisory = "warn"
ignore = [
    # arrayref 0.3.9 (YANKED, not an advisory — hence the bare package spec
    # rather than a RUSTSEC id): the yank is resolved DOWN, deliberately.
    # 0.3.10 is the only successor and declares `proc-macro1` as a NORMAL
    # dependency — a clone of proc-macro2 1.0.107 published under a spoofed
    # author mail, whose build.rs reassembles a base64-split URL, replaces
    # certificate validation with a ServerCertVerifier that accepts anything,
    # then downloads, chmods and spawns a payload at compile time.
    # MEASURED: the sparse index lists `proc-macro1 kind=normal` for 0.3.10 and
    # nothing for 0.3.9; `arrayref-0.3.10/Cargo.toml` in the checksum-verified
    # .crate carries the same edge. proc-macro1 is one character off
    # proc-macro2 and has since been removed from crates.io (404) — arrayref
    # 0.3.10 itself is still un-yanked. Chain here: lean-ctx -> blake3 1.8.6 ->
    # arrayref. Staying on the yanked version is the SMALLER risk.
    # Revisit when blake3 resolves an arrayref that is neither yanked nor
    # carries that edge — cargo deny says so itself via advisory-not-detected.
    "arrayref@0.3.9",

    # Transitive deps — no direct replacement available yet:
    "RUSTSEC-2023-0089", # atomic-polyfill (transitive via hash32/heapless)
    "RUSTSEC-2024-0436", # paste (transitive, awaiting upstream migration)
    "RUSTSEC-2026-0192", # ttf-parser (transitive via pdf-extract→lopdf, no safe upgrade)
]

[licenses]
# The allow-list below is a deliberately curated, forward-looking policy. Some
# entries (e.g. OpenSSL for `ring`, Unicode-DFS-2016) are kept so dependency
# bumps don't trip the check; `allow` silences the pedantic "not encountered"
# notice for those without weakening the policy itself.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "bzip2-1.0.6",
    "WTFPL",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
